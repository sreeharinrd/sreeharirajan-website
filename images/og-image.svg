<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Mesh Glows -->
    <radialGradient id="indigoGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanGlow" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="85%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <!-- Badge Stroke -->
    <linearGradient id="badgeStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; font-weight: 800; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; font-weight: 600; }
    .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; }
    .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; font-weight: 400; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Ambient Glows -->
  <circle cx="250" cy="200" r="450" fill="url(#indigoGlow)" />
  <circle cx="950" cy="450" r="450" fill="url(#cyanGlow)" />
  <circle cx="1000" cy="150" r="350" fill="url(#purpleGlow)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Outer Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="28" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Top Logo / Monogram -->
  <g transform="translate(80, 80)">
    <rect width="48" height="48" rx="14" fill="#4f46e5" />
    <text x="24" y="31" fill="#ffffff" font-size="20" font-weight="800" class="title" text-anchor="middle">SR</text>
    <text x="64" y="32" fill="#94a3b8" font-size="18" font-weight="600" class="subtitle">sreehariraajan.in</text>
  </g>

  <!-- Status / Role Badge -->
  <g transform="translate(750, 80)">
    <rect width="370" height="44" rx="22" fill="#1e293b" fill-opacity="0.8" stroke="url(#badgeStroke)" stroke-width="1" />
    <circle cx="24" cy="22" r="5" fill="#10b981" />
    <text x="42" y="28" fill="#e2e8f0" font-size="15" class="mono" font-weight="600">Lead Cloud &amp; AI Engineer</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 240)">
    <text x="0" y="0" fill="#f8fafc" font-size="64" class="title" letter-spacing="-0.03em">
      Sreehari Rajan
    </text>
    <text x="0" y="60" fill="url(#brandGradient)" font-size="34" class="subtitle" letter-spacing="-0.02em">
      Cloud &amp; Microservices Engineer | Java, Spring Boot, Agentic AI
    </text>
    <text x="0" y="115" fill="#94a3b8" font-size="21" class="body" opacity="0.95">
      Architecting resilient cloud microservices and building agentic AI developer tooling
    </text>
    <text x="0" y="145" fill="#94a3b8" font-size="21" class="body" opacity="0.95">
      that shifts performance and code quality left.
    </text>
  </g>

  <!-- Bottom Tech Stack Pills -->
  <g transform="translate(80, 485)">
    <!-- Pill 1: Java & Spring Boot -->
    <rect x="0" y="0" width="190" height="46" rx="12" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="23" r="4.5" fill="#10b981" />
    <text x="36" y="28" fill="#f1f5f9" font-size="15" class="subtitle">Java &amp; Spring Boot</text>

    <!-- Pill 2: Agentic AI & MCP -->
    <rect x="206" y="0" width="180" height="46" rx="12" fill="#1e293b" fill-opacity="0.9" stroke="#6366f1" stroke-width="1" stroke-opacity="0.5" />
    <text x="226" y="28" fill="#a5b4fc" font-size="15" class="subtitle">Agentic AI &amp; MCP</text>

    <!-- Pill 3: Cloud Microservices -->
    <rect x="402" y="0" width="200" height="46" rx="12" fill="#1e293b" fill-opacity="0.9" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5" />
    <text x="422" y="28" fill="#67e8f9" font-size="15" class="subtitle">Cloud Microservices</text>

    <!-- Pill 4: OpenShift & AWS -->
    <rect x="618" y="0" width="170" height="46" rx="12" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="638" y="28" fill="#e2e8f0" font-size="15" class="subtitle">OpenShift &amp; AWS</text>

    <!-- Pill 5: Performance Testing -->
    <rect x="804" y="0" width="230" height="46" rx="12" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <text x="824" y="28" fill="#e2e8f0" font-size="15" class="subtitle">LISA Tooling &amp; Profiling</text>
  </g>
</svg>
